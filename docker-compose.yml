version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: acadnexa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acadnexa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acadnexa_password}
      POSTGRES_DB: ${POSTGRES_DB:-acadnexa_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acadnexa_user} -d ${POSTGRES_DB:-acadnexa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acadnexa-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acadnexa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acadnexa_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-acadnexa_db}
      SECRET_KEY: ${SECRET_KEY:-acadnexa-super-secret-jwt-key-change-in-production-2026-secure}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
